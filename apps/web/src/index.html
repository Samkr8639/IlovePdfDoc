<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PDFTailor - Online PDF Converter & Document Tools</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PDFTailor is an elegant, privacy-first document workspace. Merge, split, compress, and convert PDF to Word or PowerPoint with zero server retention.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://pdftailor.in">

  <!-- AI Agent Resource Discovery (ARD) & LLMs.txt -->
  <link rel="agent-catalog" type="application/ai-catalog+json" href="/.well-known/ai-catalog.json">
  <link rel="ard" type="application/json" href="/.well-known/ard.json">
  <link rel="help" type="text/markdown" href="/llms.txt">

  <!-- Favicon & Web Manifest -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#14213D">

  <!-- Self-Hosted Font Preloads -->
  <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pdftailor.in">
  <meta property="og:title" content="PDFTailor - Online PDF Converter & Document Tools">
  <meta property="og:description" content="Privacy-first PDF tools: convert PDF to Word, PowerPoint, merge, compress, and split documents right in your browser or with ephemeral zero-retention processing.">
  <meta property="og:site_name" content="PDFTailor">
  <meta property="og:image" content="https://pdftailor.in/og-image.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PDFTailor - Online PDF Converter & Document Tools">
  <meta name="twitter:description" content="Fast, private PDF tools with zero permanent storage.">
  <meta name="twitter:image" content="https://pdftailor.in/og-image.webp">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src 'self' blob:; child-src 'self' blob:; object-src 'self' blob:; connect-src 'self' https://api.paperflow.app http://localhost:4000 https://localhost:4000 ws:; worker-src 'self' blob:;">

  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "PDFTailor",
    "url": "https://pdftailor.in",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5.",
    "description": "Fast, private online PDF toolkit to convert, merge, compress, split, and tailor PDF documents.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "featureList": [
      "PDF to Word Conversion with Layout Preservation",
      "PDF to PowerPoint Editable Presentation Conversion",
      "Client-Side Merge and Split PDF",
      "Effective PDF Compression with Three Presets",
      "Zero Server Retention Guarantee"
    ]
  }
  </script>

  <!-- Pre-Bootstrap Critical Loader Styles (mirrors styles.css tokens) -->
  <style id="pt-pre-loader-styles">
    #pt-app-preloader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFFFFF;
      color: #14213D;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 99999;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .pt-loader-logo {
      width: 176px;
      height: 40px;
      margin-bottom: 2rem;
      animation: pt-pulse 2s ease-in-out infinite;
    }
    .pt-loader-bar-wrap {
      width: 200px;
      height: 4px;
      background: #E6F5F3;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 1rem;
    }
    .pt-loader-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #0F766E, #14B8A6);
      border-radius: 9999px;
      animation: pt-indeterminate 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pt-loader-text {
      font-size: 0.9375rem;
      font-weight: 500;
      color: #4B5563;
      margin: 0;
      text-align: center;
      min-height: 1.5em;
    }
    .pt-loader-fallback {
      display: none;
      margin-top: 1.5rem;
      text-align: center;
      max-width: 360px;
    }
    .pt-loader-fallback-msg {
      font-size: 0.875rem;
      color: #4B5563;
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    .pt-loader-reload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #FFFFFF;
      background-color: #0F766E;
      border: 1px solid #0F766E;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .pt-loader-reload-btn:hover {
      background-color: #0B5D57;
    }
    @keyframes pt-indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
    @keyframes pt-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.98); opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pt-loader-logo { animation: none; }
      .pt-loader-bar-fill {
        animation: none;
        width: 100%;
        background: #0F766E;
      }
    }
  </style>
</head>
<body>
  <app-root>
    <div id="pt-app-preloader" aria-live="polite" role="status">
      <img src="/pdftailor-logo.svg" alt="PDFTailor" class="pt-loader-logo" width="176" height="40">
      <div class="pt-loader-bar-wrap" aria-hidden="true">
        <div class="pt-loader-bar-fill"></div>
      </div>
      <p id="pt-loader-text" class="pt-loader-text">Loading PDFTailor...</p>
      <div id="pt-loader-fallback" class="pt-loader-fallback">
        <p class="pt-loader-fallback-msg">Loading took longer than expected. Please check your internet connection and reload.</p>
        <button type="button" class="pt-loader-reload-btn" onclick="window.location.reload()">Reload Application</button>
      </div>
      <noscript>
        <div class="pt-loader-fallback" style="display: block;">
          <p class="pt-loader-fallback-msg">JavaScript is required to run PDFTailor. Please enable JavaScript in your browser settings to continue.</p>
        </div>
      </noscript>
    </div>
  </app-root>

  <script>
    (function() {
      try {
        var I18N_LOADING = {
          en: 'Loading PDFTailor...',
          es: 'Cargando PDFTailor...',
          hi: 'PDFTailor लोड हो रहा है...',
          fr: 'Chargement de PDFTailor...',
          de: 'PDFTailor wird geladen...',
          zh: '正在加载 PDFTailor...',
          ja: 'PDFTailor を読み込み中...',
          pt: 'Carregando o PDFTailor...',
          ar: 'جاري تحميل PDFTailor...',
          ru: 'Загрузка PDFTailor...',
          it: 'Caricamento di PDFTailor...'
        };
        var lang = localStorage.getItem('user_language');
        if (!lang && navigator.language) {
          lang = navigator.language.split('-')[0];
        }
        if (lang && I18N_LOADING[lang]) {
          var el = document.getElementById('pt-loader-text');
          if (el) el.textContent = I18N_LOADING[lang];
        }
      } catch (e) {}

      setTimeout(function() {
        if (!window.__pt_app_bootstrapped) {
          var fb = document.getElementById('pt-loader-fallback');
          if (fb) fb.style.display = 'block';
        }
      }, 15000);
    })();
  </script>
</body>
</html>
