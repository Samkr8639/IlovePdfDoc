<div class="watermark-preview-root">
  <!-- TOP CANVAS CONTROLS BAR -->
  <div class="canvas-top-bar" role="toolbar" aria-label="Page navigation and preview controls">
    <!-- Page Navigation -->
    <div class="nav-control-group">
      <button
        type="button"
        class="ctrl-btn"
        [disabled]="currentPage() <= 1"
        (click)="goToPrevPage()"
        aria-label="Previous page"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <span class="page-counter-text" aria-live="polite">
        Page <strong>{{ currentPage() }}</strong> of {{ totalPages() }}
      </span>

      <button
        type="button"
        class="ctrl-btn"
        [disabled]="currentPage() >= totalPages()"
        (click)="goToNextPage()"
        aria-label="Next page"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Zoom Controls -->
    <div class="zoom-control-group">
      <button
        type="button"
        class="ctrl-btn"
        [disabled]="zoom() <= 0.5"
        (click)="zoomOut()"
        aria-label="Zoom out"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <span class="zoom-level-text">{{ (zoom() * 100) | number:'1.0-0' }}%</span>

      <button
        type="button"
        class="ctrl-btn"
        [disabled]="zoom() >= 3.0"
        (click)="zoomIn()"
        aria-label="Zoom in"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <button
        type="button"
        class="ctrl-btn btn-fit-page"
        (click)="resetZoom()"
        title="Reset zoom to 100%"
        aria-label="Reset zoom"
      >
        Fit
      </button>
    </div>

    <!-- Hold to Compare Action -->
    <div class="compare-action-wrap">
      <button
        type="button"
        class="compare-toggle-btn"
        [class.active]="isCompareActive()"
        [attr.aria-pressed]="isCompareActive()"
        (mousedown)="onCompareHoldStart()"
        (mouseup)="onCompareHoldEnd()"
        (mouseleave)="onCompareHoldEnd()"
        (touchstart)="onCompareHoldStart()"
        (touchend)="onCompareHoldEnd()"
        (click)="toggleCompare()"
        title="Hold or click to hide watermark (or press 'C' key)"
        aria-label="Hold to compare without watermark"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span>Hold to compare</span>
        <kbd class="shortcut-key">C</kbd>
      </button>
    </div>
  </div>

  <!-- MAIN CANVAS VIEWPORT STAGE -->
  <div class="preview-stage-viewport" #previewViewport>
    <div
      class="preview-page-sheet"
      tabindex="0"
      role="region"
      [attr.aria-label]="previewAriaLabel()"
    >
      <!-- Layer stack: Below = watermark canvas at z-index 1, page canvas at z-index 2 -->
      <!-- Layer stack: Over = page canvas at z-index 1, watermark canvas at z-index 2 -->
      <canvas
        #pageCanvas
        class="pdf-page-canvas"
        [style.z-index]="settings().common.layer === 'below' ? 2 : 1"
        aria-hidden="true"
      ></canvas>

      <canvas
        #watermarkCanvas
        class="watermark-overlay-canvas"
        [style.z-index]="settings().common.layer === 'below' ? 1 : 2"
        [style.opacity]="isCompareActive() ? 0 : 1"
        (pointerdown)="onCanvasPointerDown($event)"
        (pointermove)="onCanvasPointerMove($event)"
        (pointerup)="onCanvasPointerUp($event)"
        (pointercancel)="onCanvasPointerUp($event)"
        aria-hidden="true"
      ></canvas>

      <!-- EXCLUDED PAGE OVERLAY BADGE -->
      @if (!isPageIncluded()) {
        <div class="page-excluded-badge" role="status">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
          </svg>
          <span>Page not included in watermark</span>
        </div>
      }
    </div>
  </div>
</div>
