<div class="watermark-preview-root">
  <!-- CONTINUOUS MULTI-PAGE DOCUMENT VIEWPORT -->
  <div class="preview-stage-viewport" #previewViewport (scroll)="onViewportScroll()">
    <div class="pages-vertical-stack">
      @for (pageNum of pagesList(); track pageNum) {
        <div
          class="preview-page-sheet"
          [id]="'watermark-page-' + pageNum"
          [class.active-page]="currentPage() === pageNum"
          tabindex="0"
          role="region"
          (click)="onPageClick(pageNum)"
          [attr.aria-label]="getPageAriaLabel(pageNum)"
        >
          <!-- Canvas for PDF page -->
          <canvas
            #pageCanvas
            [id]="'pdf-canvas-' + pageNum"
            class="pdf-page-canvas"
            [style.z-index]="settings().common.layer === 'below' ? 2 : 1"
            aria-hidden="true"
          ></canvas>

          <!-- Watermark overlay canvas for this page -->
          <canvas
            #watermarkCanvas
            [id]="'wm-canvas-' + pageNum"
            class="watermark-overlay-canvas"
            [style.z-index]="settings().common.layer === 'below' ? 1 : 2"
            [style.opacity]="isCompareActive() ? 0 : 1"
            (pointerdown)="onCanvasPointerDown($event, pageNum)"
            (pointermove)="onCanvasPointerMove($event, pageNum)"
            (pointerup)="onCanvasPointerUp($event)"
            (pointercancel)="onCanvasPointerUp($event)"
            aria-hidden="true"
          ></canvas>

          <!-- EXCLUDED PAGE OVERLAY BADGE -->
          @if (!checkIsPageIncluded(pageNum)) {
            <div class="page-excluded-badge" role="status">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              </svg>
              <span>Page not included in watermark</span>
            </div>
          }

          <!-- Page Number Indicator -->
          <div class="page-corner-indicator">Page {{ pageNum }}</div>
        </div>
      }
    </div>
  </div>
</div>
