<div class="circular-processing-screen">
  <h2 class="processing-title">{{ formattedTitle() }}</h2>

  <div class="circular-spinner-wrapper" aria-label="Loading" role="status">
    <svg class="circular-spinner-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Background track circle -->
      <circle
        class="spinner-track"
        cx="50"
        cy="50"
        r="42"
        stroke="#E5E7EB"
        stroke-width="8"
      />
      <!-- Animated active arc -->
      <circle
        class="spinner-arc"
        cx="50"
        cy="50"
        r="42"
        stroke="var(--pt-teal-700, #0F766E)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-dasharray="75 190"
      />
    </svg>
  </div>
</div>
