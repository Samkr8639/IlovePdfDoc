<div
  class="dropzone-area"
  [class.active]="isDragOver()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="fileInput.click()"
  tabindex="0"
  (keydown.enter)="fileInput.click()"
  (keydown.space)="fileInput.click()"
  role="button"
  [attr.aria-label]="ariaLabel()"
>
  <input
    #fileInput
    type="file"
    class="hidden-input"
    [accept]="acceptedTypes()"
    [multiple]="multiple()"
    (change)="onFileInputChange($event)"
  />

  <div class="dropzone-content">
    <!-- MODERN UPLOAD ICON BADGE -->
    <div class="dropzone-icon-badge" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
        <path d="M12 12v9"></path>
        <path d="m16 16-4-4-4 4"></path>
      </svg>
    </div>

    <!-- COHESIVE SIDECAR ACTION ROW: ELEVATED CTA + MATCHING CLOUD SQUIRCLES -->
    <div class="upload-action-row" (click)="$event.stopPropagation()">
      <!-- Primary File Upload Button -->
      <button
        type="button"
        class="select-file-btn"
        (click)="fileInput.click()"
        title="Select files from your device"
      >
        <svg class="btn-upload-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>{{ title() || 'Select PDF files' }}</span>
      </button>

      <!-- Sidecar Cloud Buttons (Google Drive & Dropbox) -->
      <div class="cloud-sidecar-group">
        <!-- Google Drive Button with Tooltip -->
        <div class="cloud-btn-wrapper">
          <button
            type="button"
            class="cloud-sidecar-btn google-drive-btn"
            title="Import from Google Drive"
            aria-label="Import from Google Drive"
            (click)="openGoogleDrive($event)"
          >
            <svg width="24" height="21" viewBox="0 0 87.3 78" fill="none">
              <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
              <path d="M43.65 25 29.9 1.2c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44A8.9 8.9 0 0 0 0 53h27.5z" fill="#00ac47"/>
              <path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 10.15z" fill="#ea4335"/>
              <path d="M43.65 25 57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
              <path d="M59.8 53H27.5L13.75 76.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
              <path d="M73.4 26.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25l16.15 28h27.5c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
            </svg>
          </button>
          <span class="cloud-tooltip">Google Drive</span>
        </div>

        <!-- Dropbox Button with Tooltip -->
        <div class="cloud-btn-wrapper">
          <button
            type="button"
            class="cloud-sidecar-btn dropbox-btn"
            title="Import from Dropbox"
            aria-label="Import from Dropbox"
            (click)="openDropbox($event)"
          >
            <svg width="22" height="20" viewBox="0 0 24 22" fill="#0061FF">
              <path d="M6 1.8L0 5.7L6 9.6L12 5.7L6 1.8ZM18 1.8L12 5.7L18 9.6L24 5.7L18 1.8ZM0 13.5L6 17.4L12 13.5L6 9.6L0 13.5ZM24 13.5L18 9.6L12 13.5L18 17.4L24 13.5ZM6 18.7L12 22.6L18 18.7L12 14.8L6 18.7Z"/>
            </svg>
          </button>
          <span class="cloud-tooltip">Dropbox</span>
        </div>
      </div>
    </div>

    <!-- DROP HINT -->
    <p class="drop-hint">{{ subtitle() || 'or drop files here' }}</p>

    <!-- TRUST & PRIVACY BADGES -->
    <div class="dropzone-trust-row" aria-label="Security and Privacy Guarantees">
      <div class="trust-badge-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>100% In-Browser Privacy</span>
      </div>
      <div class="trust-badge-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Instant Processing</span>
      </div>
      <div class="trust-badge-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span>Free & Unlimited</span>
      </div>
    </div>
  </div>
</div>
