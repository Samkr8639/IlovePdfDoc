<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Brand Symbol / Emblem: Layered Document Heart Square -->
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff553e"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <filter id="markShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(229, 57, 53, 0.35)"/>
    </filter>
  </defs>

  <g transform="translate(18, 14)">
    <!-- Back sheet -->
    <rect x="8" y="2" width="68" height="88" rx="10" fill="#e2e8f0"/>
    <!-- Front coral sheet -->
    <rect x="18" y="10" width="70" height="88" rx="11" fill="url(#markGrad)" filter="url(#markShadow)"/>
    <!-- Folded corner notch -->
    <path d="M66 10 L88 32 L66 32 Z" fill="#991b1b" opacity="0.4"/>
    <path d="M66 10 L88 32 L66 32 Z" fill="#ffffff" opacity="0.3"/>
    <!-- Stylized Heart cut-out on document -->
    <path d="M37 28 C37 24 33 21 29.5 21 C25.5 21 23 24.5 23 24.5 C23 24.5 20.5 21 16.5 21 C13 21 9 24 9 28 C9 35 23 44 23 44 C23 44 37 35 37 28 Z" 
          transform="translate(18, 16) scale(1.05)" 
          fill="#ffffff"/>
  </g>
</svg>
