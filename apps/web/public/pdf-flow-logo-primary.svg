<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90" fill="none">
  <!-- Brand Symbol / Emblem: Layered Document Heart -->
  <g transform="translate(15, 12)">
    <!-- Back document sheet -->
    <rect x="6" y="2" width="44" height="58" rx="6" fill="#cbd5e1" opacity="0.6"/>
    <!-- Front document sheet with coral gradient -->
    <defs>
      <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff553e"/>
        <stop offset="100%" stop-color="#e53935"/>
      </linearGradient>
      <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#ffe4e6"/>
      </linearGradient>
    </defs>
    <rect x="14" y="8" width="46" height="58" rx="7" fill="url(#coralGrad)" filter="drop-shadow(0 4px 8px rgba(229,57,53,0.3))"/>
    <!-- Folded corner notch -->
    <path d="M46 8 L60 22 L46 22 Z" fill="#b91c1c" opacity="0.45"/>
    <path d="M46 8 L60 22 L46 22 Z" fill="#ffffff" opacity="0.25"/>
    <!-- Stylized Heart cut-out on document -->
    <path d="M37 28 C37 24 33 21 29.5 21 C25.5 21 23 24.5 23 24.5 C23 24.5 20.5 21 16.5 21 C13 21 9 24 9 28 C9 35 23 44 23 44 C23 44 37 35 37 28 Z" 
          transform="translate(14, 8) scale(0.68)" 
          fill="url(#heartGrad)"/>
  </g>

  <!-- Wordmark: PDF&Doc / PDF flow -->
  <g transform="translate(94, 52)">
    <!-- Main Title -->
    <text font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">
      PDF<tspan fill="#e53935">&amp;</tspan>Doc
    </text>
    <text x="175" y="-12" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.08em">FLOW</text>
    <!-- Subtitle baseline -->
    <text x="2" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.04em">
      SECURE DOCUMENT SUITE
    </text>
  </g>
</svg>
